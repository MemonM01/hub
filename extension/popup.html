<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 340px; margin: 0; padding: 12px 14px; font: 12px/1.45 system-ui, sans-serif; background: #141513; color: #ecebe6; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      label { display: block; color: #9a9c94; margin-top: 6px; }
      input { width: 100%; box-sizing: border-box; margin-top: 2px; padding: 5px 7px; border-radius: 6px; border: 1px solid #2b2d29; background: #1d1e1b; color: inherit; font: inherit; }
      button { margin-top: 10px; padding: 6px 10px; border: 0; border-radius: 6px; background: #6fb7ad; color: #10201e; font-weight: 600; cursor: pointer; }
      button.ghost { background: none; color: #9a9c94; padding: 6px 0; margin-left: 10px; }
      button:disabled { opacity: .6; cursor: default; }
      #log { margin-top: 10px; max-height: 320px; overflow: auto; }
      #log div { margin: 1px 0; }
      .bad { color: #f2827a } .good { color: #6fb7ad } .dim { color: #9a9c94 }
    </style>
  </head>
  <body>
    <h1>hub · Minerva sync</h1>
    <div id="setup" hidden>
      <label>hub address<input id="origin" placeholder="https://hub-memonm01s-projects.vercel.app" /></label>
      <label>Sync token (from hub Settings)<input id="token" placeholder="hub_sync_…" /></label>
      <button id="save">Save</button>
    </div>
    <div id="main" hidden>
      <button id="run">Sync Minerva now</button><button id="edit" class="ghost">Change token</button>
      <div id="log"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
